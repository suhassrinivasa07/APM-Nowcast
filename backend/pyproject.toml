[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apm-nowcast-backend"
version = "0.1.0"
description = "Uncertainty-Aware Physics-Guided Adaptive Multimodal Deep Learning Framework for Thunderstorm Initiation and Lightning Nowcasting over India"
authors = [
    { name = "APM-Nowcast Research Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "xarray>=2024.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pytest-asyncio>=0.23.0",
]
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend", "..", "../common", "../data_ingestion", "../preprocessing", "../datacube", "../models", "../losses", "../training"]
